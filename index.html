<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Find The Ball - Version 4</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#070b2b;
    color:white;
}

body{
    min-height:100vh;
    position:relative;
}

/* =========================
   BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background:
        radial-gradient(circle at 20% 20%,rgba(70,100,255,.30),transparent 28%),
        radial-gradient(circle at 80% 30%,rgba(190,50,255,.25),transparent 30%),
        radial-gradient(circle at 50% 90%,rgba(0,210,255,.18),transparent 32%);
    animation:bgMove 12s ease-in-out infinite alternate;
    z-index:-3;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,255,255,.45) 1px,transparent 1.5px);
    background-size:90px 90px,140px 140px;
    background-position:0 0,40px 60px;
    opacity:.28;
    animation:stars 18s linear infinite;
    z-index:-2;
}

@keyframes bgMove{
    from{transform:translate(-2%,-2%) scale(1);}
    to{transform:translate(2%,2%) scale(1.08);}
}

@keyframes stars{
    from{background-position:0 0,40px 60px;}
    to{background-position:90px 90px,180px 150px;}
}

/* =========================
   HOME SCREEN
========================= */

.home-screen{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    overflow:auto;
}

.home-container{
    width:100%;
    max-width:480px;
    text-align:center;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.logo{
    font-size:15px;
    font-weight:900;
    letter-spacing:2px;
    opacity:.9;
}

.coin-display{
    padding:8px 13px;
    border-radius:20px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(12px);
    font-weight:bold;
}

.coin-icon{
    color:#ffd84d;
}

/* HERO */

.hero{
    margin-top:8px;
}

.hero-ball{
    width:110px;
    height:110px;
    margin:0 auto 18px;
    border-radius:50%;
    position:relative;
    background:
        radial-gradient(circle at 32% 27%,#ffffff 0 6%,#ff8b8b 7%,#ff2020 32%,#b60000 72%,#560000 100%);
    box-shadow:
        0 0 18px #ff2929,
        0 0 45px rgba(255,0,0,.65),
        0 20px 55px rgba(0,0,0,.5);
    animation:heroBall 2.5s ease-in-out infinite;
}

.hero-ball::after{
    content:"";
    position:absolute;
    width:16px;
    height:8px;
    border-radius:50%;
    background:white;
    opacity:.75;
    top:18px;
    left:25px;
    filter:blur(1px);
}

@keyframes heroBall{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-13px) rotate(8deg);}
}

.game-title{
    font-size:clamp(38px,10vw,60px);
    font-weight:1000;
    line-height:.95;
    letter-spacing:2px;
    text-shadow:
        0 3px 0 #2635a0,
        0 0 25px rgba(92,117,255,.8);
}

.game-title span{
    color:#ffd84d;
}

.tagline{
    margin-top:12px;
    color:#cbd2ff;
    font-size:15px;
}

/* CARDS */

.info-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:27px 0;
}

.info-card{
    padding:13px 7px;
    border-radius:17px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.info-number{
    font-size:21px;
    font-weight:900;
    color:#fff;
}

.info-label{
    margin-top:4px;
    font-size:10px;
    color:#aeb7ef;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* PLAY BUTTON */

.play-button{
    width:100%;
    border:none;
    border-radius:24px;
    padding:19px;
    font-size:22px;
    font-weight:1000;
    letter-spacing:2px;
    color:#11142c;
    background:linear-gradient(135deg,#ffe45c,#ffb62e);
    box-shadow:
        0 8px 0 #9a5d00,
        0 16px 35px rgba(255,187,0,.35);
    cursor:pointer;
    transition:.15s;
}

.play-button:active{
    transform:translateY(7px);
    box-shadow:
        0 2px 0 #9a5d00,
        0 7px 18px rgba(255,187,0,.25);
}

.play-icon{
    margin-right:8px;
}

/* =========================
   GAME UI
========================= */

.game-ui{
    display:none;
    position:absolute;
    inset:0;
    overflow:hidden;
}

.game-container{
    width:100%;
    max-width:700px;
    height:100%;
    margin:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
}

/* GAME HEADER */

.game-header{
    flex-shrink:0;
}

.game-header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.small-title{
    font-size:21px;
    font-weight:1000;
    letter-spacing:1px;
}

.small-title span{
    color:#ffd84d;
}

.sound-button{
    width:43px;
    height:43px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.11);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
    margin-top:10px;
}

.stat{
    min-width:0;
    padding:8px 4px;
    text-align:center;
    border-radius:13px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(10px);
}

.stat-label{
    font-size:8px;
    color:#9fa9e5;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.stat-value{
    margin-top:2px;
    font-size:16px;
    font-weight:900;
}

/* GAME STAGE */

.stage{
    position:relative;
    flex:1;
    min-height:300px;
    margin-top:10px;
    border-radius:25px;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            rgba(29,38,100,.48),
            rgba(8,12,45,.82)
        );
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        inset 0 0 40px rgba(80,100,255,.10),
        0 15px 45px rgba(0,0,0,.35);
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* GAME OVER */

.game-over{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(3,5,25,.74);
    backdrop-filter:blur(9px);
    z-index:10;
}

.game-over.hidden{
    display:none;
}

.game-over-card{
    width:88%;
    max-width:360px;
    padding:28px 22px;
    text-align:center;
    border-radius:25px;
    background:rgba(24,30,82,.88);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.game-over-card h2{
    font-size:32px;
    margin-bottom:10px;
}

.game-message{
    color:#cdd3ff;
    margin-bottom:18px;
    line-height:1.5;
}

.restart-button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:16px;
    background:linear-gradient(135deg,#6f82ff,#4357e8);
    color:white;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
}

/* BOTTOM BUTTONS */

.bottom-controls{
    display:flex;
    gap:8px;
    padding-top:9px;
    flex-shrink:0;
}

.control-button{
    flex:1;
    border:1px solid rgba(255,255,255,.13);
    border-radius:15px;
    padding:11px;
    color:white;
    background:rgba(255,255,255,.08);
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .home-screen{
        padding:14px;
    }

    .hero-ball{
        width:88px;
        height:88px;
    }

    .game-title{
        font-size:42px;
    }

    .info-cards{
        margin:20px 0;
    }

    .info-card{
        padding:11px 5px;
    }

    .info-number{
        font-size:18px;
    }

    .game-container{
        padding:9px;
    }

    .small-title{
        font-size:18px;
    }

    .stat{
        padding:7px 2px;
    }

    .stat-label{
        font-size:7px;
    }

    .stat-value{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HOME SCREEN
========================= -->

<section class="home-screen" id="homeScreen">

    <div class="home-container">

        <div class="top-bar">
            <div class="logo">ARCADE GAME</div>

            <div class="coin-display">
                <span class="coin-icon">●</span>
                <span id="homeCoins">0</span>
            </div>
        </div>

        <div class="hero">

            <div class="hero-ball"></div>

                <span>THE BALL</span>
            </h1>

            </p>

        </div>

        <div class="info-cards">

            <div class="info-card">
                <div class="info-number" id="homeBest">0</div>

            </div>

                <div class="info-number">8</div>
                <div class="info-label">Sets</div>

        </div>

<!-- =========================
     GAME UI
========================= -->

<section class="game-ui" id="gameUI">

    <div class="game-container">

        <div class="game-header">

            <div class="game-header-top">

                <div class="small-title">
                    FIND <span>THE BALL</span>
                </div>

                <button
                    class="sound-button"
                    id="soundButton"
                    aria-label="Sound">
                    🔊
                </button>

            </div>

            <div class="stats">

                <div class="stat">
                    <div class="stat-label">Set</div>
                    <div class="stat-value" id="setText">1/8</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="scoreText">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Coins</div>
                    <div class="stat-value" id="coinText">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Lives</div>
                    <div class="stat-value" id="lifeText">❤️❤️❤️</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Time</div>
                    <div class="stat-value" id="timeText">15</div>
                </div>

            </div>

        </div>


        <div class="stage" id="stage">

            <canvas id="gameCanvas"></canvas>

                class="game-over hidden"
                id="gameOver">

                    </h2>

                        class="game-message"
                        id="gameMessage">

            <button
                class="control-button"
                id="restartSmall">
                ↻ Restart
            </button>

            <button
                class="control-button"
                id="homeButton">
                ⌂ Home
            </button>

        </div>

    </div>

</section>


<script>
/* =========================================================
   FIND THE BALL - VERSION 4
   Complete JavaScript Game
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const stage = document.getElementById("stage");

const homeScreen = document.getElementById("homeScreen");
const gameUI = document.getElementById("gameUI");
const gameOver = document.getElementById("gameOver");

const playButton = document.getElementById("playButton");
const restartButton = document.getElementById("restartButton");
const restartSmall = document.getElementById("restartSmall");
const homeButton = document.getElementById("homeButton");
const soundButton = document.getElementById("soundButton");

const setText = document.getElementById("setText");
const scoreText = document.getElementById("scoreText");
const coinText = document.getElementById("coinText");
const lifeText = document.getElementById("lifeText");
const timeText = document.getElementById("timeText");

const homeCoins = document.getElementById("homeCoins");
const homeBest = document.getElementById("homeBest");

const gameOverTitle = document.getElementById("gameOverTitle");
const gameMessage = document.getElementById("gameMessage");


/* =========================================================
   GAME SETTINGS
========================================================= */

const sets = [

    {
        cups:3,
        shuffles:3,
        speed:650,
        time:15
    },

    {
        cups:3,
        shuffles:5,
        speed:560,
        time:14
    },

    {
        cups:4,
        shuffles:6,
        speed:500,
        time:13
    },

    {
        cups:4,
        shuffles:8,
        speed:440,
        time:12
    },

    {
        cups:5,
        shuffles:9,
        speed:390,
        time:11
    },

    {
        cups:5,
        shuffles:11,
        speed:340,
        time:10
    },

    {
        cups:6,
        shuffles:13,
        speed:300,
        time:9
    },

    {
        cups:6,
        shuffles:16,
        speed:260,
        time:8
    }

];


/* =========================================================
   GAME VARIABLES
========================================================= */

let W = 0;
let H = 0;
let dpr = 1;

let currentSet = 1;
let currentRound = 1;

let score = 0;
let coins = 0;
let lives = 3;
let timeLeft = 15;

let highScore =
    Number(localStorage.getItem("findBallHighScore") || 0);

let savedCoins =
    Number(localStorage.getItem("findBallCoins") || 0);

let soundOn =
    localStorage.getItem("findBallSound") !== "off";

let cups = [];
let ballCup = 0;

let phase = "idle";

let timerInterval = null;
let animationFrame = null;

let shuffleIndex = 0;
let shuffleTimer = null;

let particles = [];

let audioContext = null;


/* =========================================================
   AUDIO
========================================================= */

function getAudio(){

    if(!audioContext){

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }

    return audioContext;
}

function beep(
    frequency=440,
    duration=.08,
    type="sine"
){

    if(!soundOn) return;

    try{

        const audio = getAudio();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
            .0001,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .08,
            audio.currentTime + .01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audio.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.start();

        oscillator.stop(
            audio.currentTime + duration + .02
        );

    }catch(e){}
}


/* =========================================================
   SOUND BUTTON
========================================================= */

function updateSoundButton(){

    soundButton.textContent =
        soundOn ? "🔊" : "🔇";
}

soundButton.addEventListener("click",function(){

    soundOn = !soundOn;

    localStorage.setItem(
        "findBallSound",
        soundOn ? "on" : "off"
    );

    updateSoundButton();

    if(soundOn){
        beep(650,.08);
    }
});

updateSoundButton();


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas(){

    if(gameUI.style.display === "none"){
        return;
    }

    const rect =
        stage.getBoundingClientRect();

    if(rect.width <= 0 || rect.height <= 0){
        return;
    }

    dpr =
        Math.min(window.devicePixelRatio || 1,2);

    W = rect.width;
    H = rect.height;

    canvas.width =
        Math.floor(W * dpr);

    canvas.height =
        Math.floor(H * dpr);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   CUP POSITION
========================================================= */

function slotX(index){

    const count = cups.length;

    const side =
        Math.min(65,W * .10);

    if(count <= 1){
        return W / 2;
    }

    return side +
        index *
        ((W - side * 2) /
        (count - 1));
}


/* =========================================================
   CUP SIZE
========================================================= */

function cupWidth(){

    const count = cups.length;

    let spacing =
        count > 1
        ? (W - 2 * Math.min(65,W*.10))
          / (count - 1)
        : W;

    return Math.max(
        48,
        Math.min(
            105,
            spacing * .56
        )
    );
}


/* =========================================================
   CREATE CUPS
========================================================= */

function createCups(){

    const settings =
        sets[currentSet - 1];

    cups = [];

    for(let i=0;i<settings.cups;i++){

        cups.push({
            x:slotX(i),
            y:H*.57,
            targetX:slotX(i),
            targetY:H*.57,
            lift:0,
            scale:1
        });

    }

    ballCup =
        Math.floor(
            Math.random() * cups.length
        );
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    homeScreen.style.display = "none";

    gameUI.style.display = "block";

    /*
       IMPORTANT FIX:
       The game UI was hidden when resizeCanvas()
       originally ran. Therefore the canvas had 0 size.
       We resize AFTER making gameUI visible.
    */
    resizeCanvas();

    gameOver.classList.add("hidden");

    currentSet = 1;
    currentRound = 1;

    score = 0;
    coins = 0;
    lives = 3;

    updateUI();

    beginRound();

    try{
        getAudio().resume();
    }catch(e){}
}


/* =========================================================
   BEGIN ROUND
========================================================= */

function beginRound(){

    clearTimers();

    resizeCanvas();

    if(W <= 0 || H <= 0){
        resizeCanvas();
    }

    phase = "reveal";

    shuffleIndex = 0;

    createCups();

    particles = [];

    timeLeft =
        sets[currentSet - 1].time;

    updateUI();

    animate();

    /*
       Lift the cup above the ball
       so the red ball is clearly visible.
    */

    cups.forEach((cup,index)=>{

        cup.lift =
            index === ballCup
            ? 38
            : 0;

    });

    setTimeout(()=>{

        cups.forEach(cup=>{
            cup.lift = 0;
        });

        setTimeout(()=>{

            phase = "shuffle";

            doShuffleMove();

        },500);

    },1200);
}


/* =========================================================
   SHUFFLE
========================================================= */

function doShuffleMove(){

    if(phase !== "shuffle"){
        return;
    }

    const settings =
        sets[currentSet - 1];

    if(shuffleIndex >= settings.shuffles){

        phase = "choose";

        startTimer();

        beep(520,.10);

        return;
    }

    /*
       Swap two adjacent cups.
       The two cups move on opposite arcs,
       preventing them from visually merging.
    */

    let a =
        Math.floor(
            Math.random() * (cups.length - 1)
        );

    let b = a + 1;

    const oldA = cups[a].x;
    const oldB = cups[b].x;

    const tempCup = cups[a];

    cups[a] = cups[b];
    cups[b] = tempCup;

    cups[a].startX = oldB;
    cups[b].startX = oldA;

    cups[a].targetX = slotX(a);
    cups[b].targetX = slotX(b);

    cups[a].startY = H*.57;
    cups[b].startY = H*.57;

    cups[a].targetY = H*.57;
    cups[b].targetY = H*.57;

    cups[a].arc =
        Math.min(70,H*.12);

    cups[b].arc =
        -Math.min(70,H*.12);

    cups[a].moveStart =
        performance.now();

    cups[b].moveStart =
        performance.now();

    cups[a].moving = true;
    cups[b].moving = true;

    shuffleIndex++;

    beep(
        250 + shuffleIndex * 12,
        .045,
        "triangle"
    );

    const duration =
        settings.speed;

    shuffleTimer =
        setTimeout(
            doShuffleMove,
            duration
        );
}


/* =========================================================
   UPDATE CUP MOVEMENT
========================================================= */

function updateCups(now){

    cups.forEach(cup=>{

        if(!cup.moving){
            return;
        }

        const duration =
            sets[currentSet - 1].speed;

        let p =
            (now - cup.moveStart)
            / duration;

        p =
            Math.max(0,Math.min(1,p));

        const ease =
            p < .5
            ? 2*p*p
            : 1-Math.pow(-2*p+2,2)/2;

        const startX =
            cup.startX ??
            cup.x;

        const startY =
            cup.startY ??
            H*.57;

        cup.x =
            startX +
            (cup.targetX-startX)*ease;

        cup.y =
            startY +
            Math.sin(p*Math.PI) *
            (cup.arc || 0);

        if(p >= 1){

            cup.x =
                cup.targetX;

            cup.y =
                cup.targetY;

            cup.moving = false;

            cup.arc = 0;
        }

    });
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(timerInterval);

    timerInterval =
        setInterval(()=>{

            if(phase !== "choose"){
                return;
            }

            timeLeft--;

            updateUI();

            if(timeLeft <= 0){

                clearInterval(timerInterval);

                beep(150,.18,"sawtooth");

                loseLife(
                    "Time's up!"
                );
            }

        },1000);
}


/* =========================================================
   HANDLE PLAYER CHOICE
========================================================= */

function chooseCup(clientX){

    if(phase !== "choose"){
        return;
    }

    const rect =
        canvas.getBoundingClientRect();

    const x =
        clientX - rect.left;

    let nearest = 0;
    let distance = Infinity;

    cups.forEach((cup,index)=>{

        const d =
            Math.abs(x-cup.x);

        if(d < distance){

            distance = d;
            nearest = index;

        }

    });

    handleChoice(nearest);
}


/* =========================================================
   HANDLE CHOICE RESULT
========================================================= */

function handleChoice(index){

    if(phase !== "choose"){
        return;
    }

    phase = "result";

    clearInterval(timerInterval);

    const chosenCup =
        cups[index];

    if(index === ballCup){

        score += 100;
        coins += 5;

        createBurst(
            chosenCup.x,
            chosenCup.y - 65
        );

        beep(880,.10);
        setTimeout(
            ()=>beep(1180,.14),
            80
        );

        chosenCup.lift = 45;

        updateUI();

        setTimeout(
            roundComplete,
            900
        );

    }else{

        beep(170,.20,"sawtooth");

        createBurst(
            chosenCup.x,
            chosenCup.y - 40
        );

        chosenCup.lift = 28;

        setTimeout(()=>{

            loseLife("Wrong cup!");

        },500);

    }
}


/* =========================================================
   ROUND COMPLETE
========================================================= */

function roundComplete(){

    if(lives <= 0){
        return;
    }

    currentRound++;

    if(currentRound > 3){

        score += 250;
        coins += 10;

        if(currentSet >= 8){

            winGame();

            return;
        }

        currentSet++;
        currentRound = 1;

        updateUI();

        setTimeout(
            beginRound,
            500
        );

    }else{

        updateUI();

        setTimeout(
            beginRound,
            500
        );
    }
}


/* =========================================================
   LOSE LIFE
========================================================= */

function loseLife(message){

    lives--;

    updateUI();

    if(lives <= 0){

        endGame(
            "GAME OVER",
            message + " You ran out of lives."
        );

        return;
    }

    setTimeout(
        beginRound,
        650
    );
}


/* =========================================================
   WIN GAME
========================================================= */

function winGame(){

    score += 1000;
    coins += 50;

    saveProgress();

    updateUI();

    gameOverTitle.textContent =
        "🏆 YOU WIN!";

    gameMessage.innerHTML =
        "Amazing! You completed all 8 sets.<br><br>" +
        "Final Score: <b>" + score + "</b><br>" +
        "Coins Earned: <b>" + coins + "</b>";

    gameOver.classList.remove("hidden");

    phase = "over";

    beep(880,.12);

    setTimeout(
        ()=>beep(1100,.12),
        130
    );

    setTimeout(
        ()=>beep(1400,.20),
        260
    );
}


/* =========================================================
   END GAME
========================================================= */

function endGame(title,message){

    phase = "over";

    clearTimers();

    saveProgress();

    gameOverTitle.textContent =
        title;

    gameMessage.innerHTML =
        message +
        "<br><br>Score: <b>" +
        score +
        "</b>";

    gameOver.classList.remove("hidden");
}


/* =========================================================
   SAVE PROGRESS
========================================================= */

function saveProgress(){

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "findBallHighScore",
            highScore
        );
    }

    /*
       Add only the coins earned in this game
       to the persistent total.
    */

    savedCoins += coins;

    localStorage.setItem(
        "findBallCoins",
        savedCoins
    );

    homeCoins.textContent =
        savedCoins;

    homeBest.textContent =
        highScore;
}


/* =========================================================
   UI UPDATE
========================================================= */

function updateUI(){

    setText.textContent =
        currentSet + "/8";

    scoreText.textContent =
        score;

    coinText.textContent =
        coins;

    timeText.textContent =
        Math.max(0,timeLeft);

    let hearts = "";

    for(let i=0;i<lives;i++){
        hearts += "❤️";
    }

    if(hearts === ""){
        hearts = "💔";
    }

    lifeText.textContent =
        hearts;

    homeCoins.textContent =
        savedCoins;

    homeBest.textContent =
        highScore;
}


/* =========================================================
   CLEAR TIMERS
========================================================= */

function clearTimers(){

    clearInterval(timerInterval);

    clearTimeout(shuffleTimer);

    timerInterval = null;
    shuffleTimer = null;
}


/* =========================================================
   PARTICLES
========================================================= */

function createBurst(x,y){

    for(let i=0;i<22;i++){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.7)*5,

            life:1,

            size:
                2+Math.random()*4

        });
    }
}

function updateParticles(){

    particles.forEach(p=>{

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .08;

        p.life -= .025;

    });

    particles =
        particles.filter(
            p=>p.life > 0
        );
}

function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha =
            Math.max(0,p.life);

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "#ffd84d";

        ctx.fill();

    });

    ctx.globalAlpha = 1;
}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(x,y,r){

    ctx.save();

    /*
       Glow
    */

    ctx.shadowColor =
        "rgba(255,30,30,.9)";

    ctx.shadowBlur =
        24;

    const gradient =
        ctx.createRadialGradient(
            x-r*.35,
            y-r*.4,
            r*.08,
            x,
            y,
            r
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        .12,
        "#ff8c8c"
    );

    gradient.addColorStop(
        .38,
        "#ff2525"
    );

    gradient.addColorStop(
        .72,
        "#c40000"
    );

    gradient.addColorStop(
        1,
        "#4a0000"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    /*
       Highlight
    */

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    ctx.beginPath();

    ctx.ellipse(
        x-r*.32,
        y-r*.38,
        r*.25,
        r*.12,
        -.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Small sparkles
    */

    ctx.fillStyle =
        "rgba(255,255,255,.75)";

    for(let i=0;i<3;i++){

        const angle =
            performance.now()/500 +
            i*2;

        const sx =
            x + Math.cos(angle)*r*1.25;

        const sy =
            y + Math.sin(angle)*r*1.25;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            1.4,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   DRAW CUP
========================================================= */

function drawCup(cup,index){

    const w =
        cupWidth();

    const h =
        Math.min(
            115,
            Math.max(
                75,
                H*.19
            )
        );

    const x =
        cup.x;

    const baseY =
        cup.y;

    const lift =
        cup.lift || 0;

    /*
       Ball position:
       Always keep it clearly visible during reveal/result.
    */

    const ballRadius =
        Math.max(
            10,
            Math.min(
                18,
                w*.16
            )
        );

    const ballY =
        baseY - h*.78 - lift;

    /*
       Shadow
    */

    ctx.save();

    ctx.globalAlpha =
        .28;

    ctx.fillStyle =
        "#000";

    ctx.beginPath();

    ctx.ellipse(
        x,
        baseY+7,
        w*.45,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();


    /*
       Draw ball first.
       The cup is then drawn above it.
    */

    if(
        phase === "reveal" ||
        phase === "result" && index === ballCup
    ){

        drawBall(
            x,
            ballY,
            ballRadius
        );
    }


    /*
       Cup body
    */

    ctx.save();

    const topY =
        baseY - h - lift;

    const bottomY =
        baseY - lift;

    /*
       Cup glow
    */

    ctx.shadowColor =
        "rgba(83,105,255,.55)";

    ctx.shadowBlur =
        15;

    const cupGradient =
        ctx.createLinearGradient(
            x-w*.45,
            topY,
            x+w*.45,
            bottomY
        );

    cupGradient.addColorStop(
        0,
        "#2735a8"
    );

    cupGradient.addColorStop(
        .35,
        "#6174ff"
    );

    cupGradient.addColorStop(
        .6,
        "#303db9"
    );

    cupGradient.addColorStop(
        1,
        "#11185c"
    );

    ctx.fillStyle =
        cupGradient;

    ctx.beginPath();

    ctx.moveTo(
        x-w*.42,
        topY+10
    );

    ctx.quadraticCurveTo(
        x-w*.34,
        bottomY,
        x,
        bottomY+7
    );

    ctx.quadraticCurveTo(
        x+w*.34,
        bottomY,
        x+w*.42,
        topY+10
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur = 0;

    /*
       Top rim
    */

    const rimGradient =
        ctx.createLinearGradient(
            x-w*.48,
            topY,
            x+w*.48,
            topY+14
        );

    rimGradient.addColorStop(
        0,
        "#172071"
    );

    rimGradient.addColorStop(
        .5,
        "#93a0ff"
    );

    rimGradient.addColorStop(
        1,
        "#172071"
    );

    ctx.fillStyle =
        rimGradient;

    ctx.beginPath();

    ctx.ellipse(
        x,
        topY+7,
        w*.48,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Inner dark opening
    */

    ctx.fillStyle =
        "#080d3c";

    ctx.beginPath();

    ctx.ellipse(
        x,
        topY+7,
        w*.39,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Cup highlight
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.30)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        x-w*.27,
        topY+23
    );

    ctx.quadraticCurveTo(
        x-w*.17,
        bottomY-10,
        x-w*.05,
        bottomY-5
    );

    ctx.stroke();


    /*
       Decorative star
    */

    ctx.fillStyle =
        "rgba(255,255,255,.35)";

    const starY =
        topY + h*.48;

    drawStar(
        x,
        starY,
        Math.max(5,w*.07),
        5
    );

    ctx.restore();


    /*
       If the cup is lifted after
       correct answer, show ball underneath.
    */

    if(
        phase === "result" &&
        index === ballCup
    ){

        drawBall(
            x,
            ballY,
            ballRadius
        );
    }
}


/* =========================================================
   DRAW STAR
========================================================= */

function drawStar(
    x,
    y,
    radius,
    points
){

    ctx.beginPath();

    for(let i=0;i<points*2;i++){

        const r =
            i%2 === 0
            ? radius
            : radius*.42;

        const angle =
            -Math.PI/2 +
            i*Math.PI/points;

        const px =
            x + Math.cos(angle)*r;

        const py =
            y + Math.sin(angle)*r;

        if(i===0){
            ctx.moveTo(px,py);
        }else{
            ctx.lineTo(px,py);
        }
    }

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   DRAW FLOOR
========================================================= */

function drawFloor(){

    const floorY =
        H*.72;

    const gradient =
        ctx.createLinearGradient(
            0,
            floorY,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "rgba(80,100,220,.16)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.15)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        floorY,
        W,
        H-floorY
    );

    /*
       glowing floor line
    */

    ctx.strokeStyle =
        "rgba(100,130,255,.20)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        floorY
    );

    ctx.lineTo(
        W,
        floorY
    );

    ctx.stroke();
}


/* =========================================================
   DRAW GAME
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /*
       Background
    */

    const bg =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    bg.addColorStop(
        0,
        "#151d5e"
    );

    bg.addColorStop(
        .55,
        "#0d1447"
    );

    bg.addColorStop(
        1,
        "#070b2b"
    );

    ctx.fillStyle =
        bg;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /*
       Decorative lights
    */

    const glow =
        ctx.createRadialGradient(
            W*.5,
            H*.35,
            10,
            W*.5,
            H*.35,
            H*.65
        );

    glow.addColorStop(
        0,
        "rgba(90,110,255,.14)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawFloor();

    cups.forEach(
        (cup,index)=>{
            drawCup(cup,index);
        }
    );

    drawParticles();
}


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(now){

    if(!now){
        now = performance.now();
    }

    if(gameUI.style.display !== "none"){

        updateCups(now);

        updateParticles();

        draw();
    }

    animationFrame =
        requestAnimationFrame(animate);
}

animate();


/* =========================================================
   TOUCH / POINTER
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(e){

        if(phase !== "choose"){
            return;
        }

        e.preventDefault();

        chooseCup(e.clientX);
    }
);


/* =========================================================
   BUTTONS
========================================================= */

playButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    restartGame
);

restartSmall.addEventListener(
    "click",
    restartGame
);

homeButton.addEventListener(
    "click",
    goHome
);


/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    clearTimers();

    gameOver.classList.add("hidden");

    /*
       IMPORTANT FIX:
       Make the game visible before resizing.
    */

    homeScreen.style.display = "none";

    gameUI.style.display = "block";

    resizeCanvas();

    currentSet = 1;
    currentRound = 1;

    score = 0;
    coins = 0;
    lives = 3;

    updateUI();

    beginRound();
}


/* =========================================================
   HOME
========================================================= */

function goHome(){

    clearTimers();

    phase = "idle";

    gameOver.classList.add("hidden");

    gameUI.style.display = "none";

    homeScreen.style.display = "flex";

    updateUI();

    /*
       Stop unnecessary game animation resize issues.
    */

    resizeCanvas();
}


/* =========================================================
   LOAD SAVED DATA
========================================================= */

function loadSavedData(){

    highScore =
        Number(
            localStorage.getItem(
                "findBallHighScore"
            ) || 0
        );

    savedCoins =
        Number(
            localStorage.getItem(
                "findBallCoins"
            ) || 0
        );

    homeBest.textContent =
        highScore;

    homeCoins.textContent =
        savedCoins;
}

loadSavedData();


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

document.addEventListener(
    "dblclick",
    function(e){
        e.preventDefault();
    },
    {passive:false}
);


/* =========================================================
   VISIBILITY FIX
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            if(phase === "choose"){
                clearInterval(timerInterval);
            }

        }else{

            if(phase === "choose"){
                startTimer();
            }

            resizeCanvas();
        }

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

updateSoundButton();
updateUI();

</script>
