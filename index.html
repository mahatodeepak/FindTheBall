<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find the Ball 🎯</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 20% 20%,rgba(59,130,246,.35),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(168,85,247,.35),transparent 30%),
        linear-gradient(135deg,#020617,#0f172a,#1e1b4b,#111827);

    position:relative;
}

/* BACKGROUND STARS */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
        radial-gradient(circle,rgba(255,255,255,.4) 1px,transparent 1px);

    background-size:70px 70px,110px 110px;
    background-position:10px 20px,40px 60px;

    opacity:.35;
    pointer-events:none;
    animation:stars 15s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0);}
    to{transform:translateY(70px);}
}

.screen{
    min-height:100vh;
    padding:20px 12px;
    position:relative;
    z-index:1;
}

.hidden{
    display:none!important;
}

/* ================= START SCREEN ================= */

.start-screen{
    display:flex;
    justify-content:center;
    align-items:center;
}

.start-card{
    width:100%;
    max-width:520px;
    padding:35px 25px;
    text-align:center;

    background:rgba(15,23,42,.78);
    border:1px solid rgba(255,255,255,.18);
    border-radius:30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.15);

    backdrop-filter:blur(12px);
}

.logo{
    font-size:85px;
    animation:float 2s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

.start-card h1{
    font-size:44px;
    margin:10px 0;
}

.start-card p{
    color:#cbd5e1;
    line-height:1.6;
    font-size:17px;
}

.start-button{
    margin-top:25px;
    width:90%;
    max-width:330px;

    border:0;
    border-radius:18px;
    padding:17px;

    font-size:21px;
    font-weight:bold;
    color:white;

    background:linear-gradient(135deg,#22c55e,#16a34a);

    box-shadow:
        0 7px 0 #166534,
        0 15px 30px rgba(34,197,94,.25);

    cursor:pointer;
}

.start-button:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #166534;
}

.high-score{
    margin-top:25px;
    font-size:18px;
    color:#fde68a;
}

/* ================= GAME HEADER ================= */

.game-header{
    width:100%;
    max-width:850px;
    margin:auto;
}

.game-title{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-bottom:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    text-align:center;
    padding:9px 4px;

    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.10);
    border-radius:14px;

    backdrop-filter:blur(8px);
}

.stat-label{
    font-size:12px;
    color:#cbd5e1;
}

.stat-value{
    font-size:20px;
    font-weight:bold;
    margin-top:3px;
}

.timer-container{
    margin-top:15px;
}

.timer-background{
    width:100%;
    height:12px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
}

#timerBar{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#22c55e,#84cc16);
    transition:width .1s linear;
}

.set-label{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-top:12px;
}

#message{
    text-align:center;
    min-height:42px;
    padding:7px;
    font-size:20px;
    font-weight:bold;
}

/* ================= GAME TABLE ================= */

.table{
    width:100%;
    max-width:900px;
    height:430px;

    margin:0 auto;

    position:relative;

    border-radius:35px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(34,197,94,.30),
            rgba(6,78,59,.25) 45%,
            rgba(2,44,34,.5)
        );

    border:2px solid rgba(255,255,255,.12);

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.45),
        0 25px 60px rgba(0,0,0,.35);

    overflow:hidden;
}

/* TABLE LIGHT */

.table::before{
    content:"";
    position:absolute;
    width:400px;
    height:150px;
    left:50%;
    top:20px;
    transform:translateX(-50%);

    background:rgba(255,255,255,.07);
    filter:blur(35px);
    border-radius:50%;
}

/* CUP AREA */

#cupsArea{
    position:absolute;
    left:0;
    right:0;
    bottom:65px;
    height:180px;
}

/* CUP */

.cup{
    position:absolute;

    width:100px;
    height:135px;

    bottom:0;

    cursor:pointer;

    transition:
        left .32s cubic-bezier(.4,.1,.2,1),
        transform .25s ease;

    touch-action:manipulation;
}

.cup:hover{
    transform:scale(1.04);
}

.cup:active{
    transform:scale(.95);
}

/* CUP SHUFFLE ANIMATION */

.cup.shuffling{
    transform:translateY(-25px) rotate(3deg);
}

.cup-body{
    position:absolute;

    left:5px;
    bottom:0;

    width:90px;
    height:105px;

    background:
        linear-gradient(
            90deg,
            #7f1d1d,
            #ef4444 30%,
            #dc2626 70%,
            #7f1d1d
        );

    border-radius:12px 12px 42px 42px;

    border:3px solid #fecaca;

    box-shadow:
        0 12px 18px rgba(0,0,0,.45);

    z-index:3;
}

.cup-top{
    position:absolute;

    left:0;
    top:7px;

    width:100px;
    height:28px;

    background:
        radial-gradient(
            ellipse,
            #f87171,
            #991b1b
        );

    border-radius:50%;

    border:3px solid #fecaca;

    z-index:5;
}

/* BALL */

.ball{
    position:absolute;

    width:42px;
    height:42px;

    left:29px;
    bottom:3px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            white 0%,
            #fde047 28%,
            #f97316 70%,
            #c2410c
        );

    box-shadow:
        0 5px 12px rgba(0,0,0,.5);

    z-index:2;
}

/* CUP LIFT */

.cup.reveal .cup-body,
.cup.reveal .cup-top{
    transform:translateY(-75px);
}

/* CORRECT */

.cup.correct{
    animation:correctCup .7s ease;
}

@keyframes correctCup{
    0%{transform:scale(1);}
    35%{transform:scale(1.2) translateY(-15px);}
    65%{transform:scale(.95);}
    100%{transform:scale(1);}
}

/* WRONG */

.cup.wrong{
    animation:wrongCup .5s ease;
}

@keyframes wrongCup{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-14px);}
    40%{transform:translateX(14px);}
    60%{transform:translateX(-10px);}
    80%{transform:translateX(10px);}
}

/* TABLE FOOT */

.table-foot{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);

    width:75%;
    height:12px;

    border-radius:50%;

    background:rgba(0,0,0,.3);
    filter:blur(5px);
}

/* ================= BUTTONS ================= */

.buttons{
    text-align:center;
    margin-top:15px;
}

.small-button{
    border:0;
    border-radius:12px;
    padding:12px 20px;
    margin:4px;

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:#4f46e5;
}

#nextSetButton{
    display:none;
    background:#f59e0b;
}

/* ================= COIN EFFECT ================= */

.coin{
    position:fixed;

    font-size:38px;

    pointer-events:none;

    z-index:100;

    animation:coinUp 1s ease forwards;
}

@keyframes coinUp{
    0%{
        opacity:1;
        transform:translateY(0) scale(.7) rotate(0);
    }

    100%{
        opacity:0;
        transform:translateY(-140px) scale(1.5) rotate(360deg);
    }
}

/* ================= GAME OVER ================= */

.over-screen{
    display:flex;
    align-items:center;
    justify-content:center;
}

.over-card{
    width:100%;
    max-width:500px;

    padding:35px 25px;

    text-align:center;

    background:rgba(15,23,42,.82);

    border-radius:30px;

    border:1px solid rgba(255,255,255,.15);

    box-shadow:0 25px 70px rgba(0,0,0,.5);

    backdrop-filter:blur(12px);
}

.over-icon{
    font-size:80px;
}

.over-card h1{
    font-size:38px;
    margin:10px;
}

.final-score{
    font-size:30px;
    margin:18px;
    font-weight:bold;
}

.result-line{
    margin:8px;
    font-size:19px;
}

.new-record{
    color:#fde047;
    font-size:21px;
    font-weight:bold;
    margin:15px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .screen{
        padding:12px 7px;
    }

    .start-card{
        padding:28px 18px;
    }

    .logo{
        font-size:65px;
    }

    .start-card h1{
        font-size:34px;
    }

    .game-title{
        font-size:27px;
    }

    .stats{
        gap:4px;
    }

    .stat{
        padding:7px 2px;
    }

    .stat-label{
        font-size:10px;
    }

    .stat-value{
        font-size:16px;
    }

    #message{
        font-size:18px;
    }

    .table{
        height:370px;
        border-radius:25px;
    }

    #cupsArea{
        bottom:55px;
        height:170px;
    }

    .cup{
        width:72px;
        height:110px;
    }

    .cup-body{
        width:66px;
        height:85px;
        left:3px;
    }

    .cup-top{
        width:72px;
        height:22px;
    }

    .ball{
        width:34px;
        height:34px;
        left:19px;
    }

    .cup.reveal .cup-body,
    .cup.reveal .cup-top{
        transform:translateY(-60px);
    }

}

/* VERY SMALL PHONES */

@media(max-width:380px){

    .cup{
        width:62px;
    }

    .cup-body{
        width:58px;
    }

    .cup-top{
        width:64px;
    }

    .ball{
        left:16px;
    }

    #cupsArea{
        bottom:50px;
    }

}
</style>
</head>


<body>


<!-- =====================================================
     START SCREEN
===================================================== -->

<section id="startScreen" class="screen start-screen">

    <div class="start-card">

        <div class="logo">
            🎯
        </div>

        <h1>
            Find the Ball
        </h1>

        <p>
            Watch the ball carefully!<br>
            The cups will shuffle faster and faster.
        </p>

        <button
            class="start-button"
            onclick="startGame()">

            ▶ START GAME

        </button>

        <div class="high-score">

            🏆 High Score:
            <strong id="startHighScore">
                0
            </strong>

        </div>

    </div>

</section>


<!-- =====================================================
     GAME SCREEN
===================================================== -->

<section id="gameScreen" class="screen hidden">

    <div class="game-header">

        <div class="game-title">
            🎯 FIND THE BALL
        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    SET
                </div>

                <div
                    class="stat-value"
                    id="setValue">
                    1/8
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    ⭐ SCORE
                </div>

                <div
                    class="stat-value"
                    id="scoreValue">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    🪙 COINS
                </div>

                <div
                    class="stat-value"
                    id="coinValue">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    ❤️ LIVES
                </div>

                <div
                    class="stat-value"
                    id="lifeValue">
                    ❤️❤️❤️
                </div>

            </div>

        </div>


        <div class="timer-container">

            <div class="timer-background">

                <div id="timerBar"></div>

            </div>

        </div>


        <div
            class="set-label"
            id="roundLabel">

            Set 1 • Round 1

        </div>


        <div id="message">

            Watch the ball! 👀

        </div>

    </div>


    <!-- GAME TABLE -->

    <div class="table">

        <div id="cupsArea"></div>

        <div class="table-foot"></div>

    </div>


    <div class="buttons">

        <button
            class="small-button"
            id="soundButton"
            onclick="toggleSound()">

            🔊 Sound ON

        </button>


        <button
            class="small-button"
            id="nextSetButton"
            onclick="nextSet()">

            NEXT SET ➜

        </button>

    </div>

</section>


<!-- =====================================================
     GAME OVER
===================================================== -->

<section
    id="gameOverScreen"
    class="screen over-screen hidden">

    <div class="over-card">

        <div
            class="over-icon"
            id="overIcon">

            🏆

        </div>

        <h1 id="overTitle">
            Game Over
        </h1>


        <div class="final-score">

            ⭐
            <span id="finalScore">
                0
            </span>

        </div>


        <div class="result-line">

            🪙 Coins:
            <strong id="finalCoins">
                0
            </strong>

        </div>


        <div class="result-line">

            🏆 High Score:
            <strong id="finalHighScore">
                0
            </strong>

        </div>


        <div
            id="newRecord"
            class="new-record hidden">

            🎉 NEW HIGH SCORE!

        </div>


        <button
            class="start-button"
            onclick="playAgain()">

            🔄 PLAY AGAIN

        </button>


        <br>


        <button
            class="small-button"
            onclick="goHome()">

            🏠 HOME

        </button>

    </div>

</section>


<script>

/* =====================================================
   FIND THE BALL
   GAME ENGINE
===================================================== */


/* ================= SETTINGS ================= */

const SETS = [

    {
        cups:3,
        shuffles:3,
        speed:700,
        time:10,
        rounds:3
    },

    {
        cups:3,
        shuffles:5,
        speed:600,
        time:10,
        rounds:3
    },

    {
        cups:4,
        shuffles:6,
        speed:520,
        time:9,
        rounds:3
    },

    {
        cups:4,
        shuffles:8,
        speed:450,
        time:9,
        rounds:3
    },

    {
        cups:5,
        shuffles:9,
        speed:400,
        time:8,
        rounds:3
    },

    {
        cups:5,
        shuffles:11,
        speed:340,
        time:8,
        rounds:3
    },

    {
        cups:6,
        shuffles:12,
        speed:290,
        time:7,
        rounds:3
    },

    {
        cups:6,
        shuffles:15,
        speed:230,
        time:7,
        rounds:3
    }

];


/* ================= VARIABLES ================= */

let currentSet = 0;

let currentRound = 0;

let score = 0;

let coins = 0;

let lives = 3;

let ballCup = 0;

let acceptingAnswer = false;

let gameRunning = false;

let timerInterval = null;

let shuffleInterval = null;

let timeLeft = 0;

let soundOn = true;

let audioContext = null;


/* ================= HIGH SCORE ================= */

let highScore =
    Number(
        localStorage.getItem(
            "findBallHighScore"
        )
    ) || 0;

document.getElementById(
    "startHighScore"
).textContent = highScore;


/* ================= AUDIO ================= */

function sound(type){

    if(!soundOn) return;

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );


        if(type === "correct"){

            osc.frequency.value = 750;
            gain.gain.value = .12;

        }

        else if(type === "wrong"){

            osc.frequency.value = 180;
            gain.gain.value = .15;

        }

        else if(type === "shuffle"){

            osc.frequency.value = 350;
            gain.gain.value = .025;

        }

        else if(type === "coin"){

            osc.frequency.value = 1000;
            gain.gain.value = .08;

        }

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .15
        );

        osc.stop(
            audioContext.currentTime + .15
        );

    }catch(e){}

}


/* ================= SOUND TOGGLE ================= */

function toggleSound(){

    soundOn = !soundOn;

    document.getElementById(
        "soundButton"
    ).textContent =
        soundOn
        ? "🔊 Sound ON"
        : "🔇 Sound OFF";

}


/* ================= START ================= */

function startGame(){

    sound("correct");

    document.getElementById(
        "startScreen"
    ).classList.add("hidden");

    document.getElementById(
        "gameOverScreen"
    ).classList.add("hidden");

    document.getElementById(
        "gameScreen"
    ).classList.remove("hidden");


    currentSet = 0;

    currentRound = 0;

    score = 0;

    coins = 0;

    lives = 3;

    gameRunning = true;


    document.getElementById(
        "nextSetButton"
    ).style.display = "none";


    updateStats();

    startSet();

}


/* ================= START SET ================= */

function startSet(){

    if(!gameRunning) return;

    currentRound = 0;

    updateStats();

    nextRound();

}


/* ================= CREATE CUPS ================= */

function createCups(){

    const area =
        document.getElementById(
            "cupsArea"
        );

    area.innerHTML = "";


    const config =
        SETS[currentSet];


    const totalWidth =
        area.clientWidth;


    const cupWidth =
        window.innerWidth <= 600
        ? 72
        : 100;


    const gap =
        window.innerWidth <= 600
        ? 6
        : 15;


    const positions = [];


    const total =
        config.cups * cupWidth +
        (config.cups - 1) * gap;


    let start =
        Math.max(
            0,
            (totalWidth - total) / 2
        );


    for(let i=0;i<config.cups;i++){

        positions.push(
            start +
            i * (cupWidth + gap)
        );

    }


    for(let i=0;i<config.cups;i++){

        const cup =
            document.createElement(
                "div"
            );

        cup.className = "cup";

        cup.style.left =
            positions[i] + "px";


        cup.innerHTML = `

            <div class="ball"></div>

            <div class="cup-body"></div>

            <div class="cup-top"></div>

        `;


        cup.dataset.position = i;


        cup.onclick = function(){

            chooseCup(
                Number(
                    this.dataset.position
                )
            );

        };


        area.appendChild(cup);

    }


    return positions;

}


/* ================= NEXT ROUND ================= */

function nextRound(){

    if(!gameRunning) return;


    currentRound++;


    const config =
        SETS[currentSet];


    if(currentRound > config.rounds){

        completeSet();

        return;

    }


    acceptingAnswer = false;


    clearInterval(timerInterval);

    clearInterval(shuffleInterval);


    const positions =
        createCups();


    ballCup =
        Math.floor(
            Math.random() *
            config.cups
        );


    document.getElementById(
        "roundLabel"
    ).textContent =
        "Set " +
        (currentSet + 1) +
        " • Round " +
        currentRound;


    document.getElementById(
        "message"
    ).textContent =
        "Watch the ball! 👀";


    const cups =
        document.querySelectorAll(
            ".cup"
        );


    setTimeout(function(){

        if(!gameRunning) return;


        cups[ballCup]
            .classList.add(
                "reveal"
            );


        setTimeout(function(){

            if(!gameRunning) return;


            cups[ballCup]
                .classList.remove(
                    "reveal"
                );


            document.getElementById(
                "message"
            ).textContent =
                "Shuffling! 🔥";


            shuffleCups(
                positions
            );


        },700);


    },900);

}


/* ================= SHUFFLE CUPS ================= */

function shuffleCups(positions){

    const config =
        SETS[currentSet];


    let count = 0;


    const cupsArea =
        document.getElementById(
            "cupsArea"
        );


    shuffleInterval =
        setInterval(function(){

            if(!gameRunning){

                clearInterval(
                    shuffleInterval
                );

                return;

            }


            const cups =
                Array.from(
                    cupsArea.children
                );


            if(cups.length < 2){

                clearInterval(
                    shuffleInterval
                );

                return;

            }


            let a =
                Math.floor(
                    Math.random() *
                    cups.length
                );


            let b =
                Math.floor(
                    Math.random() *
                    cups.length
                );


            while(a === b){

                b =
                    Math.floor(
                        Math.random() *
                        cups.length
                    );

            }


            /* VISUAL SHUFFLE */

            const leftA =
                positions[a];

            const leftB =
                positions[b];


            cups[a].style.left =
                leftB + "px";


            cups[b].style.left =
                leftA + "px";


            cups[a].classList.add(
                "shuffling"
            );


            cups[b].classList.add(
                "shuffling"
            );


            setTimeout(function(){

                cups[a].classList.remove(
                    "shuffling"
                );

                cups[b].classList.remove(
                    "shuffling"
                );

            },280);


            /* BALL TRACKING */

            if(ballCup === a){

                ballCup = b;

            }

            else if(ballCup === b){

                ballCup = a;

            }


            /* UPDATE DATA POSITION */

            const oldPositionA =
                cups[a].dataset.position;

            const oldPositionB =
                cups[b].dataset.position;


            cups[a].dataset.position =
                oldPositionB;

            cups[b].dataset.position =
                oldPositionA;


            sound("shuffle");


            count++;


            if(count >= config.shuffles){

                clearInterval(
                    shuffleInterval
                );


                setTimeout(function(){

                    if(!gameRunning) return;


                    acceptingAnswer = true;


                    document.getElementById(
                        "message"
                    ).textContent =
                        "🎯 Find the Ball!";


                    startTimer();


                },350);

            }


        },config.speed);

}


/* ================= TIMER ================= */

function startTimer(){

    clearInterval(
        timerInterval
    );


    const total =
        SETS[currentSet].time;


    timeLeft = total;


    updateTimer();


    timerInterval =
        setInterval(function(){

            timeLeft -= .1;


            updateTimer();


            if(timeLeft <= 0){

                clearInterval(
                    timerInterval
                );


                timeOut();

            }


        },100);

}


/* ================= UPDATE TIMER ================= */

function updateTimer(){

    const total =
        SETS[currentSet].time;


    let percent =
        (timeLeft / total) * 100;


    if(percent < 0)
        percent = 0;


    document.getElementById(
        "timerBar"
    ).style.width =
        percent + "%";

}


/* ================= CHOOSE CUP ================= */

function chooseCup(position){

    if(!gameRunning) return;

    if(!acceptingAnswer) return;


    acceptingAnswer = false;


    clearInterval(
        timerInterval
    );


    const cups =
        document.querySelectorAll(
            ".cup"
        );


    let selected = null;


    for(let cup of cups){

        if(
            Number(
                cup.dataset.position
            ) === position
        ){

            selected = cup;
            break;

        }

    }


    if(position === ballCup){

        /* CORRECT */

        selected.classList.add(
            "correct"
        );


        score += 100;

        coins += 5;


        sound("correct");
        sound("coin");


        showCoin();


        document.getElementById(
            "message"
        ).textContent =
            "🎉 CORRECT! +100 ⭐ +5 🪙";


        updateStats();


        setTimeout(function(){

            nextRound();

        },1000);

    }

    else{

        /* WRONG */

        if(selected){

            selected.classList.add(
                "wrong"
            );

        }


        const correctCup =
            Array.from(cups).find(
                cup =>
                Number(
                    cup.dataset.position
                ) === ballCup
            );


        if(correctCup){

            correctCup.classList.add(
                "reveal"
            );

        }


        sound("wrong");


        lives--;


        updateStats();


        document.getElementById(
            "message"
        ).textContent =
            "❌ Wrong!";


        if(lives <= 0){

            setTimeout(
                gameOver,
                1200
            );

        }

        else{

            setTimeout(
                nextRound,
                1300
            );

        }

    }

}


/* ================= TIME OUT ================= */

function timeOut(){

    if(!acceptingAnswer)
        return;


    acceptingAnswer = false;


    lives--;


    updateStats();


    document.getElementById(
        "message"
    ).textContent =
        "⏰ Time's Up!";


    sound("wrong");


    if(lives <= 0){

        setTimeout(
            gameOver,
            1200
        );

    }

    else{

        setTimeout(
            nextRound,
            1300
        );

    }

}


/* ================= COMPLETE SET ================= */

function completeSet(){

    acceptingAnswer = false;


    clearInterval(
        timerInterval
    );


    clearInterval(
        shuffleInterval
    );


    if(currentSet >= 7){

        gameOver();

        return;

    }


    score += 250;

    coins += 10;


    updateStats();


    document.getElementById(
        "message"
    ).textContent =
        "🏆 SET " +
        (currentSet + 1) +
        " COMPLETE!";


    document.getElementById(
        "nextSetButton"
    ).style.display =
        "inline-block";

}


/* ================= NEXT SET ================= */

function nextSet(){

    document.getElementById(
        "nextSetButton"
    ).style.display =
        "none";


    currentSet++;


    if(currentSet >= 8){

        gameOver();

        return;

    }


    document.getElementById(
        "message"
    ).textContent =
        "🚀 SET " +
        (currentSet + 1) +
        " STARTING!";


    updateStats();


    setTimeout(
        startSet,
        900
    );

}


/* ================= COIN ================= */

function showCoin(){

    const coin =
        document.createElement(
            "div"
        );


    coin.className =
        "coin";


    coin.textContent =
        "🪙";


    coin.style.left =
        (
            window.innerWidth / 2
        ) + "px";


    coin.style.top =
        (
            window.innerHeight / 2
        ) + "px";


    document.body.appendChild(
        coin
    );


    setTimeout(function(){

        coin.remove();

    },1000);

}


/* ================= STATS ================= */

function updateStats(){

    document.getElementById(
        "setValue"
    ).textContent =
        (currentSet + 1) + "/8";


    document.getElementById(
        "scoreValue"
    ).textContent =
        score;


    document.getElementById(
        "coinValue"
    ).textContent =
        coins;


    let hearts = "";


    for(let i=0;i<3;i++){

        if(i < lives){

            hearts += "❤️";

        }else{

            hearts += "🖤";

        }

    }


    document.getElementById(
        "lifeValue"
    ).textContent =
        hearts;

}


/* ================= GAME OVER ================= */

function gameOver(){

    gameRunning = false;

    acceptingAnswer = false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        shuffleInterval
    );


    let newRecord = false;


    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "findBallHighScore",
            highScore
        );

        newRecord = true;

    }


    document.getElementById(
        "gameScreen"
    ).classList.add("hidden");


    document.getElementById(
        "gameOverScreen"
    ).classList.remove("hidden");


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "finalCoins"
    ).textContent =
        coins;


    document.getElementById(
        "finalHighScore"
    ).textContent =
        highScore;


    if(newRecord){

        document.getElementById(
            "newRecord"
        ).classList.remove(
            "hidden"
        );

    }

    else{

        document.getElementById(
            "newRecord"
        ).classList.add(
            "hidden"
        );

    }


    if(lives <= 0){

        document.getElementById(
            "overIcon"
        ).textContent =
            "💥";

        document.getElementById(
            "overTitle"
        ).textContent =
            "Game Over";

    }

    else{

        document.getElementById(
            "overIcon"
        ).textContent =
            "🏆";

        document.getElementById(
            "overTitle"
        ).textContent =
            "Amazing!";

    }

}


/* ================= PLAY AGAIN ================= */

function playAgain(){

    document.getElementById(
        "gameOverScreen"
    ).classList.add("hidden");


    document.getElementById(
        "gameScreen"
    ).classList.remove("hidden");


    currentSet = 0;

    currentRound = 0;

    score = 0;

    coins = 0;

    lives = 3;

    gameRunning = true;


    updateStats();

    startSet();

}


/* ================= HOME ================= */

function goHome(){

    gameRunning = false;


    clearInterval(
        timerInterval
    );

    clearInterval(
        shuffleInterval
    );


    document.getElementById(
        "gameOverScreen"
    ).classList.add("hidden");


    document.getElementById(
        "gameScreen"
    ).classList.add("hidden");


    document.getElementById(
        "startScreen"
    ).classList.remove("hidden");


    document.getElementById(
        "startHighScore"
    ).textContent =
        highScore;

}


/* ================= RESIZE ================= */

window.addEventListener(
    "resize",
    function(){

        if(gameRunning){

            createCups();

        }

    }
);

</script>
